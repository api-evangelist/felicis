aid: felicis
name: Felicis Ventures
description: >-
  Felicis Ventures is an early-stage venture capital firm founded in 2006 by
  Aydin Senkut and headquartered in Menlo Park, California. The firm backs
  founders "who rewrite the rules," concentrating the majority of its capital at
  Seed and Series A while also participating in Series B and select growth
  rounds, with reported assets under management of roughly $2.4B and a tenth
  flagship fund (FV X) of $900M closed in June 2025. Typical checks range from
  about $2M to $40M. Felicis is thesis-driven across artificial intelligence,
  cybersecurity and defense, global resilience and energy, health and bio,
  infrastructure, and vertical SaaS, and invests globally (backing founders from
  40+ countries rather than only Silicon Valley). The firm leads or co-leads a
  large share of its deals, sources most new investments through founder
  referrals, and is known for founder-friendly practices including a commitment
  to vote with founders on board matters and a "1% Founder Development Pledge."
  Its portfolio and exits include Shopify, Adyen, Canva, Notion, Credit Karma,
  Fitbit, Guardant Health, Docker, PagerDuty, Twitch, Supabase, and Runway.
